[manual_stepper ctc_axis]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
velocity: 90
accel: 500

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[ctc_tower]
axis: A
angle_delta: 180.0

[gcode_macro ASSERT_CTC_TOWER_A]
gcode:
  {% set axis_index = printer.gcode_move.axis_map.A %}
  {% set expect_gcode = params.GCODE|float %}
  {% set expect_toolhead = params.TOOLHEAD|float %}
  {% set gcode_a = printer.gcode_move.position[axis_index]|float %}
  {% set toolhead_a = printer.toolhead.position[axis_index]|float %}
  {% if gcode_a < expect_gcode - 0.1 or gcode_a > expect_gcode + 0.1 %}
    { action_raise_error("ctc_tower logical A mismatch") }
  {% endif %}
  {% if toolhead_a < expect_toolhead - 0.1 or toolhead_a > expect_toolhead + 0.1 %}
    { action_raise_error("ctc_tower toolhead A mismatch") }
  {% endif %}

[gcode_macro ASSERT_CTC_TOWER_UNREGISTERED]
gcode:
  {% if printer.gcode_move.position.x < 5.9 or printer.gcode_move.position.x > 6.1 %}
    { action_raise_error("ctc_tower unregistered logical X mismatch") }
  {% endif %}
  {% if printer.toolhead.position.x < 5.9 or printer.toolhead.position.x > 6.1 %}
    { action_raise_error("ctc_tower unregistered toolhead X mismatch") }
  {% endif %}
