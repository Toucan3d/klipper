# Test config for the HCU V0.3 toolhead (heater PID on the HCU firmware)
[mcu]
serial: /dev/ttyACM0

[mcu hcu]
serial: /dev/ttyUSB0
restart_method: command

[printer]
kinematics: none
max_velocity: 1000
max_accel: 1000

[extruder]
step_pin: hcu:RA7
dir_pin: !hcu:RA0
microsteps: 16
rotation_distance: 14.8
nozzle_diameter: 1
filament_diameter: 1.75
sensor_type: temperature_hcu
min_temp: 0
max_temp: 290
min_extrude_temp: 200
max_extrude_only_distance: 500.0
max_extrude_cross_section: 100
heater_pin: induction
control: hcu
max_power: 100
resonance_frequency: 150000
pid_Kp: 46.382
pid_Ki: 6.777
pid_Kd: 79.355

[tmc2130 extruder]
cs_pin: hcu:RD11
spi_bus: spi1
sense_resistor: 0.150
run_current: 1

[extruder_stepper extruder1]
extruder: extruder
step_pin: hcu:RC10
dir_pin: hcu:RC4
microsteps: 16
rotation_distance: 14.8

[manual_stepper stepper_a]
step_pin: hcu:RD10
dir_pin: hcu:RD9
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 360
endstop_pin: !hcu:RC8

[fan]
pin: hcu:RB4
cycle_time: 0.00004
hardware_pwm: True

[heater_fan heatbreak_fan]
pin: hcu:RA9
heater: extruder
cycle_time: 0.00004
hardware_pwm: True

[temperature_sensor Transistors]
sensor_type: Generic 3950
sensor_pin: hcu:RA3

[filament_encoder sfs]
pin: ^PG13
mm_per_edge: 2.88
extruder: extruder
