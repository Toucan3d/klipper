# Test config for filament_encoder with an angle sensor as length source
# and the pulse counter of an SFS next to it
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[extruder]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF4
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250
min_extrude_temp: 0
max_extrude_only_velocity: 120

[angle filament_wheel]
sensor_type: as5047d
cs_pin: PA15
spi_bus: spi3
sample_period: 0.001

[filament_encoder sfs]
angle_sensor: filament_wheel
mm_per_rev: 31.4
pin: ^PG13
mm_per_edge: 1.483
extruder: extruder

[temperature_sensor sfs_flow]
sensor_type: filament_flow
encoder: sfs

[filament_encoder wheel_only]
angle_sensor: angle filament_wheel
mm_per_rev: -25.0
mm_per_edge: 2.88
angle_hysteresis: 0.5

[gcode_macro _CHECK_ANGLE]
gcode:
    {% set e = printer["filament_encoder sfs"] %}
    {% if e.length_source != "angle" or e.mm_per_rev != 31.4 %}
        {action_raise_error("filament_encoder angle source missing")}
    {% endif %}
    {% if e.angle_errors is not defined or e.sfs_edges is not defined %}
        {action_raise_error("filament_encoder angle fields missing")}
    {% endif %}
    {% set w = printer["filament_encoder wheel_only"] %}
    {% if w.mm_per_rev != -25.0 or w.sfs_edges is not none %}
        {action_raise_error("filament_encoder wheel_only mismatch")}
    {% endif %}
    {action_respond_info("angle source ok")}
