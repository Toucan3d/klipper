# Test config for a_axis_check
[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[manual_stepper stepper_a]
step_pin: gpio5
dir_pin: gpio6
enable_pin: !gpio13
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 360
endstop_pin: !gpio19

[a_axis_check]
fault_gcode:
    M118 A axis lost steps
