# Test config for filament_encoder, encoder before display sensor
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[tmc2130 extruder]
cs_pin: PC4
spi_bus: spi1
run_current: 0.8

[extruder]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF4
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250
min_extrude_temp: 0
max_extrude_only_velocity: 120

[load_cell lc]
sensor_type: hx711
sclk_pin: PB3
dout_pin: PB4
sample_rate: 10

[temperature_sensor lc_force]
sensor_type: load_cell_force
load_cell: lc

[filament_switch_sensor sfs_runout]
switch_pin: ^PG12

[filament_encoder sfs]
pin: ^PG13
mm_per_edge: 2.88
extruder: extruder
load_cell: lc
stall_steppers: extruder

[temperature_sensor sfs_flow]
sensor_type: filament_flow
encoder: sfs

[filament_encoder aux]
pin: ^PG14
mm_per_edge: 1.5
speed_window: 0.5

[temperature_sensor aux_speed]
sensor_type: filament_flow
encoder: aux
value: speed
report_time: 0.5

[gcode_macro _CHECK_FLOW]
gcode:
    {% set r = printer["filament_encoder sfs"].last_result %}
    {% set min_ratio = params.MIN_RATIO|default(95)|float %}
    {% if r is none or r.ratio is none %}
        {action_respond_info("FLOW check skipped, no result")}
    {% elif r.ratio < min_ratio %}
        {action_raise_error("FLOW check failed, ratio %.1f below %.1f" % (r.ratio, min_ratio))}
    {% else %}
        {action_respond_info("FLOW check ok, ratio %.1f" % (r.ratio,))}
    {% endif %}

[gcode_macro _CHECK_STATUS]
gcode:
    {% set e = printer["filament_encoder sfs"] %}
    {% if e.mm_per_edge != 2.88 %}
        {action_raise_error("filament_encoder mm_per_edge mismatch")}
    {% endif %}
    {% if e.monitor.active is not defined %}
        {action_raise_error("filament_encoder monitor missing")}
    {% endif %}
    {% if e.force is not defined or e.monitor.force_avg is not defined %}
        {action_raise_error("filament_encoder force fields missing")}
    {% endif %}
    {action_respond_info("force=%.1f" % (printer["temperature_sensor lc_force"].temperature,))}
    {action_respond_info("flow=%.1f" % (printer["temperature_sensor sfs_flow"].temperature,))}
