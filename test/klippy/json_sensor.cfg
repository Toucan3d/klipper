# Test config for json_sensor
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

# File next to this config, old unix_time, so no stale check
[json_sensor fixed]
path: json_sensor_test.json
max_age: 0

# File that does not exist
[json_sensor absent]
path: /nonexistent/json_sensor_live.json
field: freq_hz

[temperature_sensor fixed_graph]
sensor_type: json_sensor
sensor: fixed
scale: 0.01

[temperature_sensor absent_graph]
sensor_type: json_sensor
sensor: absent

[gcode_macro _CHECK_JSON_SENSOR]
gcode:
    {% set f = printer["json_sensor fixed"] %}
    {% set a = printer["json_sensor absent"] %}
    {% if f.state != "streaming" or f.value != 1000.0 or f.delta != 0.0 %}
        {action_raise_error("fixed sensor wrong: %s" % (f,))}
    {% endif %}
    {% if f.sps != 300.0 or not f.recording %}
        {action_raise_error("fixed sensor fields wrong: %s" % (f,))}
    {% endif %}
    {% if a.state != "missing" or a.value is not none %}
        {action_raise_error("absent sensor wrong: %s" % (a,))}
    {% endif %}
    {% if "temperature_sensor fixed_graph" not in printer.heaters.available_sensors %}
        {action_raise_error("json temperature sensor not registered")}
    {% endif %}
    {% if printer["temperature_sensor absent_graph"].temperature != 0.0 %}
        {action_raise_error("absent graph not 0")}
    {% endif %}
    {action_respond_info("json_sensor ok")}
