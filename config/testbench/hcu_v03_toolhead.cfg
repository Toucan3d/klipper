# Toucan3D toolhead on the HCU V0.3 board
#
# Ported 2026-11-05 from the BTT-Pad7 printer (biqu@10.0.0.102): the HCU
# sections of printer.cfg, Extruder.cfg, ABC_Stepper.cfg and the HOME_A
# macros of macros.cfg. Pins and values are unchanged from that printer,
# The heater uses the PID of the HCU V0.3 firmware like on that printer.
#
# Not ported, because they belong to that printer and not to the toolhead:
# [ctc], [ctc_tower], [bed_mesh], [homing_override], [heater_bed], the G1
# override for A-only moves and the print start/end macros.

[mcu hcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

#####################################################################
# Extruder, two synchronised steppers on one induction hotend
#####################################################################

[extruder]
step_pin: hcu:RA7
dir_pin: !hcu:RA0
microsteps: 16
rotation_distance: 14.8
nozzle_diameter: 1
filament_diameter: 1.75
sensor_type: temperature_hcu
min_temp: 0
max_temp: 290
min_extrude_temp: 100# cold extrusion protection
max_extrude_only_distance: 500.0
max_extrude_cross_section: 100
pressure_advance: 0.06
pressure_advance_smooth_time: 0.04

# Heater output. The HCU V0.3 firmware runs the heater PID itself, the
# host only sends the target temperature (heater_pin induction, control
# hcu, restored on test-bench). The values are those of the source
# printer:
#   max_power            input power limit in W, sent as 100 W / 24 V =
#                        4.167 A current limit at startup
#   resonance_frequency  bridge switching frequency in Hz
# Run PID_CALIBRATE HEATER=extruder before relying on the PID values.
# SAVE_CONFIG cannot store the result while pid_Kp/Ki/Kd are set in this
# included file, remove the three lines here first.
# Tested on the bench 2026-11-05: the V0.3 firmware PID ignores low targets
# (50 C gave no power, 100 C and 240 C heat). 55 -> 240 C in 49 s, overshoot
# 0.6 C, holding power about 0.13. Calibrate MEASURE_RESONANCE_FREQUENCY
# after changing the nozzle or coil.
heater_pin: induction
control: hcu
max_power: 100
resonance_frequency: 147000      # MEASURE_RESONANCE_FREQUENCY 2026-11-10, new coil (old coil: 117000)
pid_Kp: 46.382
pid_Ki: 6.777
pid_Kd: 79.355

[tmc2130 extruder]
cs_pin: hcu:RD11
spi_bus: spi1
sense_resistor: 0.150
run_current: 1
interpolate: False
stealthchop_threshold: 1
driver_SGT: 10         # stall value in a usable range, tested 2026-11-11

[extruder_stepper extruder1]
extruder: extruder
step_pin: hcu:RC10
dir_pin: hcu:RC4
microsteps: 16
rotation_distance: 14.8
pressure_advance: 0.06
pressure_advance_smooth_time: 0.04

[tmc2130 extruder_stepper extruder1]
cs_pin: hcu:RC11
spi_bus: spi1
sense_resistor: 0.150
run_current: 1
interpolate: False
stealthchop_threshold: 1
driver_SGT: 10

# No [induction_heater] section: the V0.3 firmware has no induction_*
# commands. The current limit comes from max_power in [extruder], change
# it at runtime with SET_HEATER_CURRENT_LIMIT HEATER=extruder CURRENT=<A>.

[verify_heater extruder]
hysteresis: 20

#####################################################################
# Rotating A axis
#####################################################################

[manual_stepper stepper_a]
step_pin: hcu:RD10
dir_pin: hcu:RD9
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 360
endstop_pin: !hcu:RC8
position_endstop: 15
homing_speed: 100
homing_retract_dist: 10
second_homing_speed: 20

[tmc2130 manual_stepper stepper_a]
cs_pin: hcu:RD12
spi_bus: spi1
sense_resistor: 0.15
run_current: 0.3
stealthchop_threshold: 1

# HOME_A finds both edges of the endstop pin (clockwise and counterclockwise
# trigger points), moves to the midpoint and makes that A=0. The stages are
# split into helper macros because the stopped position can only be read
# after the blocking homing move has finished.
[gcode_macro HOME_A]
description: Home manual_stepper stepper_a and re-register it as G-code axis A
gcode:
    {% set seek_from = params.SEEK_FROM|default(-400)|float %}
    {% set release_dist = params.RELEASE_DIST|default(30)|float %}
    {% set clearance = params.CLEARANCE|default(2)|float %}
    {% set home_speed = params.SPEED|default(50)|float %}

    {% if seek_from >= 0 %}
        { action_raise_error("HOME_A: SEEK_FROM must be negative") }
    {% endif %}
    {% if release_dist <= 0 %}
        { action_raise_error("HOME_A: RELEASE_DIST must be positive") }
    {% endif %}
    {% if clearance <= 0 %}
        { action_raise_error("HOME_A: CLEARANCE must be positive") }
    {% endif %}
    {% if home_speed <= 0 %}
        { action_raise_error("HOME_A: SPEED must be positive") }
    {% endif %}

    MANUAL_STEPPER STEPPER=stepper_a GCODE_AXIS=
    MANUAL_STEPPER STEPPER=stepper_a ENABLE=1

    # Release an initially active switch by moving counterclockwise.
    MANUAL_STEPPER STEPPER=stepper_a SET_POSITION=0
    MANUAL_STEPPER STEPPER=stepper_a MOVE={-release_dist} SPEED={home_speed} STOP_ON_ENDSTOP=inverted_probe

    # Probe clockwise. The helper runs after this blocking move and reads
    # the stopped position from the temporarily registered A axis.
    MANUAL_STEPPER STEPPER=stepper_a SET_POSITION={seek_from}
    MANUAL_STEPPER STEPPER=stepper_a MOVE=0 SPEED={home_speed} STOP_ON_ENDSTOP=probe
    MANUAL_STEPPER STEPPER=stepper_a GCODE_AXIS=A LIMIT_VELOCITY=100000 LIMIT_ACCEL=80000 INSTANTANEOUS_CORNER_VELOCITY=500
    _HOME_A_AFTER_CW RELEASE_DIST={release_dist} CLEARANCE={clearance} SPEED={home_speed}

[gcode_macro _HOME_A_AFTER_CW]
description: Internal HOME_A stage after the clockwise trigger
gcode:
    {% set axis_index = printer.gcode_move.axis_map.A %}
    {% set cw_pos = printer.toolhead.position[axis_index]|float %}
    {% set release_dist = params.RELEASE_DIST|float %}
    {% set clearance = params.CLEARANCE|float %}
    {% set home_speed = params.SPEED|float %}

    MANUAL_STEPPER STEPPER=stepper_a GCODE_AXIS=

    # Continue clockwise through the pin until the switch releases.
    MANUAL_STEPPER STEPPER=stepper_a MOVE={cw_pos + release_dist} SPEED={home_speed} STOP_ON_ENDSTOP=inverted_probe
    MANUAL_STEPPER STEPPER=stepper_a GCODE_AXIS=A LIMIT_VELOCITY=100000 LIMIT_ACCEL=80000 INSTANTANEOUS_CORNER_VELOCITY=400
    _HOME_A_AFTER_RELEASE CW_POS={cw_pos} CLEARANCE={clearance} SPEED={home_speed}

[gcode_macro _HOME_A_AFTER_RELEASE]
description: Internal HOME_A stage after passing clockwise through the pin
gcode:
    {% set axis_index = printer.gcode_move.axis_map.A %}
    {% set release_pos = printer.toolhead.position[axis_index]|float %}
    {% set cw_pos = params.CW_POS|float %}
    {% set clearance = params.CLEARANCE|float %}
    {% set home_speed = params.SPEED|float %}

    MANUAL_STEPPER STEPPER=stepper_a GCODE_AXIS=

    # Add clearance, then reverse and probe the opposite edge counterclockwise.
    MANUAL_STEPPER STEPPER=stepper_a MOVE={release_pos + clearance} SPEED={home_speed}
    MANUAL_STEPPER STEPPER=stepper_a MOVE={cw_pos} SPEED={home_speed} STOP_ON_ENDSTOP=probe
    MANUAL_STEPPER STEPPER=stepper_a GCODE_AXIS=A LIMIT_VELOCITY=100000 LIMIT_ACCEL=80000 INSTANTANEOUS_CORNER_VELOCITY=400
    _HOME_A_FINISH CW_POS={cw_pos} SPEED={home_speed}

[gcode_macro _HOME_A_FINISH]
description: Internal HOME_A stage that applies the measured midpoint
gcode:
    {% set axis_index = printer.gcode_move.axis_map.A %}
    {% set cw_pos = params.CW_POS|float %}
    {% set ccw_pos = printer.toolhead.position[axis_index]|float %}
    {% set center = (cw_pos + ccw_pos) / 2.0 %}
    {% set trigger_span = ccw_pos - cw_pos %}
    {% set home_speed = params.SPEED|float %}

    MANUAL_STEPPER STEPPER=stepper_a GCODE_AXIS=

    # Move to the measured center and make that physical position A=0.
    MANUAL_STEPPER STEPPER=stepper_a MOVE={center} SPEED={home_speed}
    MANUAL_STEPPER STEPPER=stepper_a SET_POSITION=0
    MANUAL_STEPPER STEPPER=stepper_a GCODE_AXIS=A LIMIT_VELOCITY=100000 LIMIT_ACCEL=80000 INSTANTANEOUS_CORNER_VELOCITY=400
    RESPOND TYPE=command MSG="HOME_A: CW={cw_pos}, CCW={ccw_pos}, SPAN={trigger_span}, CENTER={center}"

#####################################################################
# Probe
#####################################################################

# The offsets are those of the source printer. With kinematics none on the
# bench only QUERY_PROBE is of use.
[probe]
pin: hcu:RB0
z_offset: 1.25
x_offset: 22.15
y_offset: -15.6
samples: 1
samples_result: median
sample_retract_dist: 1
samples_tolerance: 0.02
samples_tolerance_retries: 2

#####################################################################
# Fans
#####################################################################

[fan]
pin: hcu:RB4
shutdown_speed: 1.0
cycle_time: 0.00004
hardware_pwm: True

[heater_fan heatbreak_fan]
pin: hcu:RA9
max_power: 1.0
heater: extruder
shutdown_speed: 1.0
cycle_time: 0.00004
hardware_pwm: True

# Exhaust fan
[controller_fan extruder_cooler]
pin: hcu:RA5
stepper: manual_stepper stepper_a
heater: extruder
shutdown_speed: 1.0
cycle_time: 0.00004
hardware_pwm: True

#####################################################################
# Sensors
#####################################################################

[thermistor transistor_thermistor]
temperature1: 25
resistance1: 10000
beta: 3400

[temperature_sensor Transistors]
sensor_type: transistor_thermistor
sensor_pin: hcu:RA3
pullup_resistor: 10000

[filament_switch_sensor Fillament_Sensor]
switch_pin: !hcu:RC7

#####################################################################
# Lighting
#####################################################################

[output_pin bed_led]
pin: hcu:RB7
value: 1
shutdown_value: 1
