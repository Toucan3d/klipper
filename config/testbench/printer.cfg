#####################################################################
# BTT SFS V2.0, runout switch and motion encoder
#####################################################################

[filament_switch_sensor sfs_runout]
switch_pin: ^PG12          # DIAG4
pause_on_runout: False

[filament_encoder sfs]
pin: ^PG13                 # DIAG5
mm_per_edge: 1.483         # new filament path, from the calibrated extruder at 15-40 mm3/s, 2026-11-11 (old path 1.506)
load_cell: loadcell         # sync force to FLOW_MONITOR runs
stall_steppers: extruder, extruder_stepper extruder1   # TMC2130 stall data in logged runs
stall_interval: 0.020
extruder: extruder          # commanded length and ratio in FLOW_MONITOR

[temperature_sensor sfs_flow]
sensor_type: filament_flow
encoder: sfs

