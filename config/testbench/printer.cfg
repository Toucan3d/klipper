[include mainsail.cfg]
[include loadcell.cfg]
# HCU V0.3 toolhead (heater PID on the HCU V0.3 firmware)
[include hcu_v03_toolhead.cfg]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_26002C001051303432383339-if00
[virtual_sdcard]
path: /home/testbench/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: none
max_velocity: 1000
max_accel: 1000


#####################################################################
# Thermistors, Generic 3950 (100K NTC)
#####################################################################

[temperature_sensor tb]
sensor_type: Generic 3950
sensor_pin: PF3            # TB
# Without min_temp and max_temp Klipper only reports the value. Set both once
# a heater depends on this sensor, then a broken or unplugged sensor stops the
# printer instead of reading nonsense.
#min_temp: 0
#max_temp: 300

[temperature_sensor t0]
sensor_type: Generic 3950
sensor_pin: PF4            # T0
#min_temp: 0
#max_temp: 300

#####################################################################
# Fan on FAN0, set by hand
#####################################################################

[fan_generic fan0]
pin: PA8                   # FAN0
# Set the speed in Mainsail or KlipperScreen, or with
#   SET_FAN_SPEED FAN=fan0 SPEED=0.5
#max_power: 1.0
#kick_start_time: 0.100
#off_below: 0.10

