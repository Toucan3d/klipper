#####################################################################
# Load cell, 10 kg bridge on a generic HX711 module (channel A, gain 128)
# Powered with 3.3 V from SPI3 header J74, used as plain GPIO.
# RATE pin tied to GND on the module, so it runs at 10 SPS.
#####################################################################

[load_cell loadcell]
sensor_type: hx711
sclk_pin: PB3              # J74 SPI3 SCK
dout_pin: PB4              # J74 SPI3 MISO
sample_rate: 10
gain: A-128
# counts_per_gram and reference_tare_counts are written by
# LOAD_CELL_CALIBRATE and SAVE_CONFIG, do not set them by hand.

# Force in grams for graphs in Mainsail and KlipperScreen. Shows 0 until the
# load cell is calibrated. NOTE: the current calibration in the SAVE_CONFIG
# block of printer.cfg is NOMINAL (1.0 mV/V datasheet value, 214.75 counts/g),
# replace it with LOAD_CELL_CALIBRATE and a reference mass before real tests.
[temperature_sensor nozzle_force]
sensor_type: load_cell_force
load_cell: loadcell
